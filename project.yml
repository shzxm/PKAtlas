name: PKAtlas
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  PKAtlas:
    type: application
    platform: iOS
    sources:
      # No WebKit or WKWebView in the iOS target. Legacy sources remain
      # available in the repository only for historical reference.
      - path: Sources/PKAtlasApp.swift
      - path: Native
      - path: Resources/Assets.xcassets
      - path: Resources/Model/drug-catalog.json
        buildPhase: resources
      - path: Resources/Model/engine-compat.json
        buildPhase: resources
      - path: Resources/Model/github-release-public-key.txt
        buildPhase: resources
      - path: Resources/Model/site-engine.js
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 药时
        CFBundleURLTypes:
          - CFBundleURLName: org.pkatlas.app.open
            CFBundleURLSchemes: [pkatlasopen]
        CFBundleName: PKAtlas
        CFBundleShortVersionString: "2.7"
        CFBundleVersion: "11"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsDocumentBrowser: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - org.pkatlas.open.refresh
        NSHealthShareUsageDescription: "经您授权后读取 Apple 健康已登记的药物，用于对照药时本机记录。"
        NSHealthUpdateUsageDescription: "药时不会向 Apple 健康写入用药事件；本功能仅申请读取权限。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pkatlas.open
        CODE_SIGN_ENTITLEMENTS: 'Resources/PKAtlas-$(CONFIGURATION).entitlements'
        PRODUCT_NAME: PKAtlas
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: YES
        ENABLE_APP_SANDBOX: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        MARKETING_VERSION: "2.7"
        CURRENT_PROJECT_VERSION: "11"
        SDKROOT: iphoneos
    scheme:
      testTargets:
        - PKAtlasUITests
        - PKAtlasNativeTests
      gatherCoverageData: false

  PKAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PKAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pkatlas.openUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PKAtlas
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO

  PKAtlasNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NativeTests
    dependencies:
      - target: PKAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.pkatlas.openNativeTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
